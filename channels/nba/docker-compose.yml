services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      VOICEVOX_URL: http://voicevox:50021
      TZ: Asia/Tokyo
    volumes:
      - ./data:/app/data
      - ./credentials:/app/credentials
    depends_on:
      - voicevox

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    restart: unless-stopped
    command: ["--host", "0.0.0.0"]
