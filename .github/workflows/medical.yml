name: Medical daily video

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *" # 03:17 JST

permissions:
  contents: write

concurrency:
  group: medical-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: channels/medical
    env:
      TZ: Asia/Tokyo
      MEDICAL_NEWS_LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      VOICEVOX_URL: http://127.0.0.1:50021
      VOICEVOX_AUTO_START: "0"
      YOUTUBE_UPLOAD_PRIVACY: private
      ENABLE_AUTO_PUBLISH: ${{ vars.ENABLE_AUTO_PUBLISH == 'true' && '1' || '0' }}
      FFMPEG_TIMEOUT: "3600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: channels/medical/requirements.txt
      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore small pipeline state
        uses: actions/cache@v4
        with:
          path: channels/medical/data
          key: medical-state-${{ github.run_id }}
          restore-keys: medical-state-
      - name: Create runtime credentials
        working-directory: .
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.MEDICAL_YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.MEDICAL_YT_TOKEN_JSON }}
        run: python scripts/write_credentials.py channels/medical/credentials
      - name: Verify upload destination
        working-directory: .
        run: python scripts/verify_youtube_channel.py --credentials-dir channels/medical/credentials --expected-id UCG7vSxIAPl-Zuv5y0uWJYwg --expected-title "医療と医学の最新ニュース"
      - name: Start VOICEVOX
        run: |
          docker run -d --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest --host 0.0.0.0
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:50021/version && break; sleep 3; done
          curl -fsS http://127.0.0.1:50021/version
      - name: Generate and upload privately
        run: python -m generator.run_daily
      - name: Quality gate
        working-directory: .
        run: python scripts/quality_gate.py channels/medical
      - name: Publish only after opt-in
        if: vars.ENABLE_AUTO_PUBLISH == 'true'
        run: python -m generator.auto_publish
      - name: Keep JSON state only
        if: always()
        run: find data -type f ! -name '*.json' -delete
      - name: Keep scheduled workflows active
        if: success() && github.event_name == 'schedule'
        working-directory: .
        run: |
          date -u +%FT%TZ > .github/last-successful-run
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/last-successful-run
          git commit -m "chore: record successful cloud run" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
