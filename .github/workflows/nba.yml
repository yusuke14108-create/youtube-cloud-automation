name: NBA daily video

on:
  workflow_dispatch:
    inputs:
      force_fresh_test:
        description: "Ignore today's cached pipeline state for a fresh private test"
        required: false
        type: boolean
        default: false
      rerender_latest_script:
        description: "Rerender the latest cached script to verify presentation-only fixes"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 20 * * *" # 05:17 JST

permissions:
  contents: read

concurrency:
  group: nba-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: channels/nba
    env:
      TZ: Asia/Tokyo
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      VOICEVOX_URL: http://127.0.0.1:50021
      ENABLE_UPLOAD: "true"
      ENABLE_AUTO_PUBLISH: ${{ vars.ENABLE_AUTO_PUBLISH || 'false' }}
      FFMPEG_TIMEOUT: "3600"
      PIPELINE_RUN_SUFFIX: ${{ inputs.force_fresh_test && format('_test_{0}', github.run_id) || '' }}
      RERENDER_SUFFIX: ${{ format('rerender_{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: channels/nba/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore small pipeline state
        uses: actions/cache@v4
        with:
          path: channels/nba/data
          key: nba-state-${{ github.run_id }}
          restore-keys: nba-state-
      - name: Create runtime credentials
        working-directory: .
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.NBA_YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.NBA_YT_TOKEN_JSON }}
        run: python scripts/write_credentials.py channels/nba/credentials
      - name: Verify upload destination
        working-directory: .
        run: python scripts/verify_youtube_channel.py --credentials-dir channels/nba/credentials --expected-id UC-bnuR5UppuY_cnpLTxWyaA --expected-title "バスケ魂🔥 日本人NBA速報"
      - name: Refresh audience performance guidance
        run: python -m generator.performance
      - name: Start VOICEVOX
        run: |
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:50021/version && break; sleep 3; done
          curl -fsS http://127.0.0.1:50021/version
      - name: Generate and upload privately
        if: inputs.rerender_latest_script != true
        run: python -m generator.cli run --upload-private
      - name: Rerender latest script and upload privately
        if: inputs.rerender_latest_script == true
        run: python -m generator.rerender_latest
      - name: Quality gate
        working-directory: .
        run: python scripts/quality_gate.py channels/nba
      - name: Publish only after opt-in
        if: vars.ENABLE_AUTO_PUBLISH == 'true'
        run: python -m generator.auto_publish
      - name: Keep JSON state only
        if: always()
        run: test ! -d data || find data -type f ! -name '*.json' -delete
