name: MLB daily video

on:
  workflow_dispatch:
    inputs:
      short_test:
        description: "Generate one fresh MLB Short and upload it privately"
        required: false
        type: boolean
        default: false
      report_links_only:
        description: "Report links from the latest saved upload without generating"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 18 * * *" # 03:17 JST; finish private upload before 05:00

permissions:
  contents: read

concurrency:
  group: mlb-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: channels/mlb
    env:
      TZ: Asia/Tokyo
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      VOICEVOX_URL: http://127.0.0.1:50021
      VOICEVOX_AUTO_START: "0"
      ENABLE_AUTO_PUBLISH: ${{ vars.ENABLE_AUTO_PUBLISH || 'false' }}
      FFMPEG_TIMEOUT: "3600"
      YOUTUBE_SCHEDULE_PUBLIC_HOUR: "6"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: channels/mlb/requirements.txt
      - name: Install dependencies
        if: inputs.report_links_only != true
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore small pipeline state
        uses: actions/cache@v4
        with:
          path: channels/mlb/data
          key: mlb-state-${{ github.run_id }}
          restore-keys: mlb-state-
      - name: Create runtime credentials
        if: inputs.report_links_only != true
        working-directory: .
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.MLB_YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.MLB_YT_TOKEN_JSON }}
        run: python scripts/write_credentials.py channels/mlb/credentials
      - name: Verify upload destination
        if: inputs.report_links_only != true
        working-directory: .
        run: python scripts/verify_youtube_channel.py --credentials-dir channels/mlb/credentials --expected-id UCwl8YMNbXi-zhaD4zeSwB5g --expected-title "メジャー魂🔥 日本人MLB速報"
      - name: Start VOICEVOX
        if: inputs.report_links_only != true
        run: |
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:50021/version && break; sleep 3; done
          curl -fsS http://127.0.0.1:50021/version
      - name: Generate one fresh test Short privately
        if: inputs.report_links_only != true && inputs.short_test == true
        env:
          YOUTUBE_SCHEDULE_PUBLIC_HOUR: ""
        run: python -m generator.short_test
      - name: Generate and upload privately
        if: inputs.report_links_only != true && inputs.short_test != true
        run: python -m generator.scheduled_generate
      - name: Report latest saved video links
        if: inputs.report_links_only == true
        run: |
          latest=$(find data/uploads -type f -name '*.json' ! -name '*.partial.json' | sort | tail -1)
          test -n "$latest"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); print("longs=" + " ".join("https://youtu.be/" + x for x in d.get("longs", []))); print("shorts=" + " ".join("https://youtu.be/" + x for x in d.get("shorts", [])))' "$latest"
      - name: Quality gate
        if: inputs.report_links_only != true
        working-directory: .
        run: python scripts/quality_gate.py channels/mlb
      - name: Keep JSON state only
        if: always()
        run: test ! -d data || find data -type f ! -name '*.json' -delete
